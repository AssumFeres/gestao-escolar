<h2 class="titulo-formulario">Confirmar exclusão</h2>
<fieldset class="campo-customizado">
    <legend class="visualmente-oculto">Confirmação de exclusão</legend>
    <p>Tem certeza que deseja excluir <strong>{{ object }}</strong>? Esta ação não pode ser desfeita.</p>
</fieldset>

<form method="post" action="{{ request.path }}{% if request.GET.parcial == '1' %}?parcial=1{% endif %}" class="form-modal-crud">
    {% csrf_token %}
    {% include 'includes/resumo_erros_formulario.html' with form=form only %}
    
    <button type="submit" class="btn-salvar">
        Excluir
    </button>
    {% include 'includes/cancelar_modal.html' %}
</form>
