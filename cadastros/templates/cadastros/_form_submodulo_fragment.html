<h3>{% if editando %}Editar SubModulo{% else %}Novo SubModulo{% endif %}</h3>

<form method="post" action="{{ request.path }}?parcial=1" class="form-modal-crud">
    {% csrf_token %}
    <div class="grid-2-colunas"> 
        <div class="campo">{{ form.nome.label_tag }} {{ form.nome }} {{ form.nome.errors }}</div>
        <div class="campo">{{ form.sigla.label_tag }} {{ form.sigla }} {{ form.sigla.errors }}</div>
    </div>
    <button type="submit">Salvar SubModulo</button>
</form>

<p style="margin-top:12px; color:#999; font-size:0.7rem;">📄 cadastros/templates/cadastros/_form_submodulo_fragment.html</p>
