<h2 class="titulo-formulario">Vincular Pessoa</h2>
<p>Ata: <strong>{{ ata.numero }} - {{ ata.get_finalidade_display }}</strong></p>

<form method="post" action="{{ request.path }}?parcial=1" class="form-modal-crud">
    {% csrf_token %}
    {% include 'includes/resumo_erros_formulario.html' with form=form only %}
    {% include 'includes/campo_formulario.html' with campo=form.pessoa only %}
    <button type="submit" class="btn-salvar">Vincular</button>
</form>
