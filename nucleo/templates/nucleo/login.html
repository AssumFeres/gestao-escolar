{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto; padding: 32px; background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; font-family: system-ui, sans-serif;">
    
    <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="color: #002060; margin: 0 0 8px 0; font-size: 1.5rem; font-weight: 700;">Acesso ao Sistema</h2>
        <p style="color: #64748b; margin: 0; font-size: 0.9rem;">Identifique-se para acessar os módulos de gestão.</p>
    </div>

    {% if form.errors %}
        <div style="background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 16px; border: 1px solid #fecaca;">
            Usuário ou senha incorretos. Tente novamente.
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <div style="margin-bottom: 16px;">
            <label style="display: block; color: #334155; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px;">Usuário</label>
            <input type="text" name="username" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 24px;">
            <label style="display: block; color: #334155; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px;">Senha</label>
            <input type="password" name="password" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box;">
        </div>

        <button type="submit" style="width: 100%; background: #002060; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s;">
            Entrar no Sistema
        </button>
    </form>
</div>
{% endblock %}
